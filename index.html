<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CVForge - Free CV Builder</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#f1f5f9;
  color:#111827;
}

header{
  background:#111827;
  color:white;
  text-align:center;
  padding:35px 20px;
}

header h1{
  margin:0;
  font-size:34px;
}

header p{
  margin:10px 0 0;
  color:#cbd5e1;
}

.container{
  max-width:1100px;
  margin:25px auto;
  padding:15px;
  display:grid;
  grid-template-columns:380px 1fr;
  gap:25px;
}

.box{
  background:white;
  padding:22px;
  border-radius:15px;
  box-shadow:0 5px 20px rgba(0,0,0,.08);
}

label{
  display:block;
  font-weight:bold;
  margin-top:12px;
}

input,
textarea,
select{
  width:100%;
  padding:12px;
  margin-top:6px;
  border:1px solid #d1d5db;
  border-radius:8px;
  font-size:15px;
}

textarea{
  min-height:90px;
}

button{
  width:100%;
  padding:13px;
  margin-top:12px;
  border:0;
  border-radius:8px;
  background:#111827;
  color:white;
  font-size:16px;
  font-weight:bold;
}

button:active{
  transform:scale(.98);
}

.cv{
  background:white;
  min-height:700px;
  padding:45px;
  border:1px solid #ddd;
}

.cv h1{
  margin:0;
  font-size:34px;
}

.cv .contact{
  color:#64748b;
  margin-top:8px;
}

.cv h2{
  margin-top:30px;
  padding-bottom:7px;
  border-bottom:2px solid #111827;
}

.cv p{
  line-height:1.6;
  white-space:pre-line;
}


/* TEMPLATE 2 */

.modern{
  border-left:10px solid #2563eb;
}

.modern h2{
  color:#2563eb;
  border-bottom:2px solid #2563eb;
}


/* TEMPLATE 3 */

.minimal{
  font-family:Georgia, serif;
}

.minimal h1{
  text-align:center;
}

.minimal .contact{
  text-align:center;
}

.minimal h2{
  text-align:center;
  border-bottom:1px solid #999;
}


/* MOBILE */

@media(max-width:800px){

  .container{
    grid-template-columns:1fr;
  }

  .cv{
    padding:25px;
  }

}


/* PRINT */

@media print{

  body{
    background:white;
  }

  header,
  .form-box,
  .preview-title{
    display:none;
  }

  .container{
    display:block;
    margin:0;
    padding:0;
  }

  .box{
    box-shadow:none;
    padding:0;
  }

  .cv{
    border:0;
  }

}

</style>
</head>


<body>


<header>

<h1>CVForge</h1>

<p>Create a professional CV in minutes</p>

</header>



<div class="container">


<!-- FORM -->

<div class="box form-box">

<h2>Your Information</h2>


<label>Full Name</label>

<input
id="name"
placeholder="John Doe"
>


<label>Email</label>

<input
id="email"
placeholder="john@email.com"
>


<label>Phone</label>

<input
id="phone"
placeholder="+62 812 3456 789"
>


<label>About Me</label>

<textarea
id="about"
placeholder="Write a short professional introduction"
></textarea>


<label>Experience</label>

<textarea
id="experience"
placeholder="Company - Position - Years"
></textarea>


<label>Education</label>

<textarea
id="education"
placeholder="University - Degree - Year"
></textarea>


<label>Choose Template</label>

<select id="template">

<option value="classic">
Classic
</option>

<option value="modern">
Modern
</option>

<option value="minimal">
Minimal
</option>

</select>


<button onclick="generateCV()">
Generate CV
</button>


<button onclick="window.print()">
Download / Print CV
</button>


</div>



<!-- PREVIEW -->

<div class="box">

<h2 class="preview-title">
CV Preview
</h2>


<div
id="cvPreview"
class="cv"
>

<h1>Your Name</h1>

<div class="contact">
Email | Phone
</div>


<h2>About Me</h2>

<p>
Your introduction will appear here.
</p>


<h2>Experience</h2>

<p>
Your experience will appear here.
</p>


<h2>Education</h2>

<p>
Your education will appear here.
</p>


</div>

</div>


</div>



<script>


function generateCV(){

const name =
document.getElementById("name").value;

const email =
document.getElementById("email").value;

const phone =
document.getElementById("phone").value;

const about =
document.getElementById("about").value;

const experience =
document.getElementById("experience").value;

const education =
document.getElementById("education").value;

const template =
document.getElementById("template").value;


const preview =
document.getElementById("cvPreview");


preview.className =
"cv " + template;


preview.innerHTML = `

<h1>
${name || "Your Name"}
</h1>

<div class="contact">

${email || "Email"} |
${phone || "Phone"}

</div>


<h2>
About Me
</h2>

<p>
${about || "Your professional introduction will appear here."}
</p>


<h2>
Experience
</h2>

<p>
${experience || "Your work experience will appear here."}
</p>


<h2>
Education
</h2>

<p>
${education || "Your education will appear here."}
</p>

`;

}


</script>


</body>
</html>
