<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CV Builder</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 25px 20px;
      text-align: center;
    }

    header h1 {
      margin: 0 0 8px;
    }

    .container {
      max-width: 1000px;
      margin: 20px auto;
      padding: 15px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .box {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.08);
    }

    input,
    textarea {
      width: 100%;
      padding: 12px;
      margin: 8px 0 15px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 10px;
      border: none;
      border-radius: 8px;
      background: #111;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .cv {
      border: 1px solid #ddd;
      padding: 25px;
      min-height: 500px;
      background: white;
    }

    .cv h1 {
      margin-bottom: 5px;
    }

    .cv h2 {
      border-bottom: 2px solid #111;
      padding-bottom: 5px;
      margin-top: 25px;
    }

    @media (max-width: 700px) {

      .container {
        grid-template-columns: 1fr;
      }

    }

  </style>
</head>

<body>

<header>

  <h1>CV Builder</h1>

  <p>Create your professional CV for free</p>

</header>

<div class="container">

  <div class="box">

    <h2>Your Information</h2>

    <label>Full Name</label>

    <input
      id="name"
      placeholder="John Doe"
    >

    <label>Email</label>

    <input
      id="email"
      placeholder="john@email.com"
    >

    <label>Phone</label>

    <input
      id="phone"
      placeholder="+62 812 3456 7890"
    >

    <label>About Me</label>

    <textarea
      id="about"
      placeholder="Tell employers about yourself"
    ></textarea>

    <label>Experience</label>

    <textarea
      id="experience"
      placeholder="Company - Position - Years"
    ></textarea>

    <label>Education</label>

    <textarea
      id="education"
      placeholder="University - Degree - Year"
    ></textarea>

    <button onclick="generateCV()">
      Generate CV
    </button>

    <button onclick="downloadCV()">
      Download CV
    </button>

  </div>


  <div class="box">

    <h2>Preview</h2>

    <div
      class="cv"
      id="cvPreview"
    >

      <h1>Your Name</h1>

      <p>Email | Phone</p>

      <h2>About Me</h2>

      <p>
        Your introduction will appear here.
      </p>

      <h2>Experience</h2>

      <p>
        Your experience will appear here.
      </p>

      <h2>Education</h2>

      <p>
        Your education will appear here.
      </p>

    </div>

  </div>

</div>


<script>

function generateCV() {

  const name =
    document.getElementById("name").value;

  const email =
    document.getElementById("email").value;

  const phone =
    document.getElementById("phone").value;

  const about =
    document.getElementById("about").value;

  const experience =
    document.getElementById("experience").value;

  const education =
    document.getElementById("education").value;


  document.getElementById("cvPreview").innerHTML = `

    <h1>
      ${name || "Your Name"}
    </h1>

    <p>
      ${email || "Email"} |
      ${phone || "Phone"}
    </p>

    <h2>
      About Me
    </h2>

    <p>
      ${about || "Your introduction will appear here."}
    </p>

    <h2>
      Experience
    </h2>

    <p>
      ${experience || "Your experience will appear here."}
    </p>

    <h2>
      Education
    </h2>

    <p>
      ${education || "Your education will appear here."}
    </p>

  `;

}


function downloadCV() {

  window.print();

}

</script>

</body>
</html>
